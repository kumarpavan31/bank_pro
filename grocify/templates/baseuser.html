<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-image: url("https://cdn3.f-cdn.com/contestentries/2447228/77278059/66c3373dd1eaf_thumb900.jpg");
            background-size: contain; /* Smaller background image */
            background-repeat: no-repeat; /* Prevent image from repeating */
            background-attachment: fixed; /* Fix the image in place */
            background-position: center; /* Center the background image */
            background-color: #f4f7fa; /* Fallback color */
            opacity: 0.9; /* Adjust opacity for the background image */
        }
        h2 {
            text-align: center;
            color: #343a40;
        }
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .product-card {
            background-color: #ffffff;
            border: 2px solid #28a745; /* Green border */
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 10px;
            text-align: center;
            max-width: 250px; /* Limit the width of each card */
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px; /* Rounded image corners */
        }
        a {
            display: block;
            margin: 10px 0;
            color: #28a745; /* Green links */
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #218838; /* Darker green on hover */
        }
        form {
            text-align: center;
            margin: 20px 0;
        }
        input[type="submit"] {
            background-color: #28a745; /* Green button */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #218838; /* Darker green on hover */
        }
    </style>
</head>
<body>
    <div>
        {% block content %}{% endblock %}
    </div>
    <div class="container">
        <h2>Our Products</h2>
        {% if products %}
            <div class="product-grid">
                {% for product in products %}
                    <div class="product-card">
                        <img src="data:image/jpeg;base64,{{ product[8] }}" alt="{{ product[1] }}">
                        <h3>{{ product[1] }}</h3>
                        <p>{{ product.description }}</p>
                        <p>Price: ${{ product[4] }}</p>
                        <a href="/add_to_cart/{{customer_id}}/{{product[0]}}">Add to Cart</a>
                        <a href="#">Buy Now</a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>No products available</p>
        {% endif %}
    </div>

    <form action="/cart/{{customer_id}}" method="post">
        <input type="submit" value="Go To Cart">
    </form>
</body>
</html>
